---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: virtualmachines.vm.kube-vm.io
spec:
  group: vm.kube-vm.io
  names:
    categories:
    - all
    kind: VirtualMachine
    listKind: VirtualMachineList
    plural: virtualmachines
    shortNames:
    - kvm
    - kubevm
    singular: virtualmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .status.ipAddress
      name: IP
      type: string
    - jsonPath: .spec.cpus
      name: CPUs
      priority: 1
      type: integer
    - jsonPath: .spec.memoryMiB
      name: Memory
      priority: 1
      type: integer
    - jsonPath: .status.vmID
      name: VM ID
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: VirtualMachine is a kube-vm virtual machine hosted on a node.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: VirtualMachineSpec is the desired state of a kube-vm virtual
              machine.
            properties:
              autoCOW:
                description: AutoCOW wraps writable local disks in automatically managed
                  copy-on-write overlays.
                type: boolean
              boot:
                description: Boot configures the kernel/firmware boot.
                properties:
                  cmdline:
                    description: |-
                      Cmdline is the guest kernel command line. When empty kube-vm uses
                      "console=hvc0 root=/dev/vda reboot=t".
                    type: string
                  firmware:
                    description: Firmware is an experimental firmware image path or
                      URL used instead of a kernel.
                    type: string
                  initrd:
                    description: Initrd is an initial ramdisk path or URL on the node.
                    type: string
                  iso:
                    description: ISO is an ISO path or URL attached as a read-only
                      block device.
                    type: string
                  kernel:
                    description: Kernel is a kernel image path or URL on the node.
                    type: string
                  serialConsole:
                    description: SerialConsole additionally enables a serial console.
                    type: boolean
                type: object
              cpus:
                default: 1
                description: CPUs is the number of vCPUs.
                format: int32
                maximum: 254
                minimum: 1
                type: integer
              disks:
                description: Disks are attached as virtio block devices.
                items:
                  description: Disk attaches one virtio block device. Exactly one
                    source must be set.
                  properties:
                    baseDisk:
                      description: |-
                        BaseDisk names an image in the node's kube-vm base-disk catalog. kube-vm
                        creates a per-VM copy-on-write overlay, so the base image is never modified.
                        At most one baseDisk is allowed; it is attached after the other disks.
                      minLength: 1
                      type: string
                    memory:
                      anyOf:
                      - type: integer
                      - type: string
                      description: Memory creates a RAM-backed disk of this size.
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    overlay:
                      description: Overlay makes path a copy-on-write base by redirecting
                        writes to this absolute overlay path.
                      pattern: ^/[^?#]*$
                      type: string
                    path:
                      description: Path is an absolute image path on the node.
                      pattern: ^/[^?#]*$
                      type: string
                    readOnly:
                      description: ReadOnly attaches the disk read-only (path and
                        memory disks).
                      type: boolean
                    url:
                      description: URL is a remote http(s) image; remote disks are
                        read-only.
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of baseDisk, path, url or memory must be
                      set
                    rule: '[has(self.baseDisk), has(self.path), has(self.url), has(self.memory)].filter(x,
                      x).size() == 1'
                  - message: overlay requires path
                    rule: '!has(self.overlay) || has(self.path)'
                  - message: a copy-on-write disk cannot be readOnly
                    rule: '!(has(self.readOnly) && self.readOnly) || !(has(self.baseDisk)
                      || has(self.overlay))'
                  - message: url must be http or https
                    rule: '!has(self.url) || self.url.startsWith(''http://'') || self.url.startsWith(''https://'')'
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              idle:
                description: Idle configures automatic pausing of inactive VMs.
                properties:
                  diskPauseAfter:
                    description: DiskPauseAfter moves a paused VM's RAM to disk after
                      this much inactivity.
                    type: string
                  pauseAfter:
                    description: PauseAfter pauses a VM in memory after this much
                      inactivity. Zero disables.
                    type: string
                  wakeOnNetwork:
                    description: WakeOnNetwork resumes an idle-paused VM on network
                      traffic. Defaults to true.
                    type: boolean
                type: object
                x-kubernetes-validations:
                - message: diskPauseAfter requires a nonzero pauseAfter that is shorter
                    than diskPauseAfter
                  rule: '!has(self.diskPauseAfter) || (has(self.pauseAfter) && duration(self.pauseAfter)
                    > duration(''0s'') && duration(self.diskPauseAfter) > duration(self.pauseAfter))'
              ioUring:
                description: IOUring opts in to experimental io_uring block I/O.
                properties:
                  queueDepth:
                    description: QueueDepth is the maximum requests per batch; 0 selects
                      the kube-vm default.
                    format: int32
                    maximum: 256
                    minimum: 0
                    type: integer
                type: object
              memoryBalancing:
                description: MemoryBalancing opts in to automatic memory redistribution
                  between guests.
                properties:
                  minMiB:
                    description: MinMiB is the guest floor in MiB. When unset kube-vm
                      applies its own default.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              memoryMiB:
                default: 1024
                description: MemoryMiB is the guest RAM in MiB.
                format: int32
                minimum: 16
                type: integer
              network:
                description: Network attaches virtio NICs.
                items:
                  description: NetworkInterface attaches one virtio NIC.
                  properties:
                    mac:
                      description: MAC overrides the generated guest MAC address.
                      pattern: ^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$
                      type: string
                    switch:
                      description: Switch registers the TAP port with the node's kube-vm-switch
                        daemon.
                      type: boolean
                    tapName:
                      description: TapName is the host TAP device for type TAP.
                      maxLength: 15
                      minLength: 1
                      type: string
                    type:
                      description: Type selects NAT (kube-vm creates a TAP with host
                        NAT) or TAP (existing device).
                      enum:
                      - NAT
                      - TAP
                      type: string
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: tapName is required for TAP and not allowed for NAT
                    rule: 'self.type == ''TAP'' ? has(self.tapName) : !has(self.tapName)'
                maxItems: 8
                type: array
                x-kubernetes-list-type: atomic
              nodeName:
                description: |-
                  NodeName pins the VM to a node running the agent. When unset the scheduler
                  chooses a node. It is immutable because VM state lives on one host.
                type: string
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector restricts scheduler placement to nodes with
                  these labels.
                type: object
              paused:
                description: Paused pauses the running VM in memory; clearing it resumes
                  the VM.
                type: boolean
              provisioning:
                description: Provisioning writes files and authorizes SSH before the
                  first boot.
                properties:
                  files:
                    description: Files are written into the guest overlay (at most
                      128, 4 MiB total).
                    items:
                      description: |-
                        ProvisionFile writes a file or directory into the guest's copy-on-write
                        overlay before the first boot.
                      properties:
                        configMapKeyRef:
                          description: ConfigMapKeyRef reads content from a ConfigMap
                            key in the VM's namespace.
                          properties:
                            key:
                              description: |-
                                The key to select from the ConfigMap's Data field.
                                Keys in the BinaryData field are not currently propagated to container env vars.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        content:
                          description: Content is inline text.
                          type: string
                        data:
                          description: Data is inline binary content (base64 in YAML/JSON).
                          format: byte
                          type: string
                        directory:
                          description: Directory creates a directory instead of a
                            file.
                          type: boolean
                        gid:
                          description: GID owns the entry in the guest. Defaults to
                            0.
                          format: int32
                          minimum: 0
                          type: integer
                        mode:
                          description: Mode is an octal permission string such as
                            "0600". Defaults to 0600 (files) or 0700 (directories).
                          pattern: ^0?[0-7]{3,4}$
                          type: string
                        path:
                          description: Path is the absolute guest path.
                          pattern: ^/.+
                          type: string
                        secretKeyRef:
                          description: SecretKeyRef reads content from a Secret key
                            in the VM's namespace.
                          properties:
                            key:
                              description: The key of the secret to select from.  Must
                                be a valid secret key.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the Secret or its key must
                                be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        uid:
                          description: UID owns the entry in the guest. Defaults to
                            0.
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - path
                      type: object
                      x-kubernetes-validations:
                      - message: files need exactly one content source; directories
                          need none
                        rule: '(has(self.directory) && self.directory) ? !(has(self.content)
                          || has(self.data) || has(self.secretKeyRef) || has(self.configMapKeyRef))
                          : [has(self.content), has(self.data), has(self.secretKeyRef),
                          has(self.configMapKeyRef)].filter(x, x).size() == 1'
                    maxItems: 128
                    type: array
                  ssh:
                    description: |-
                      SSH authorizes the VM's generated key and stores the key pair in the
                      Secret "<name>-ssh" (keys ssh-privatekey, ssh-publickey, username).
                    properties:
                      home:
                        description: Home is the account's absolute home directory
                          in the guest.
                        pattern: ^/.+
                        type: string
                      user:
                        description: User is an existing guest account name.
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: user or home is required
                      rule: has(self.user) || has(self.home)
                type: object
              runStrategy:
                default: Always
                description: RunStrategy controls start/stop behaviour.
                enum:
                - Always
                - Once
                - Halted
                type: string
              updateStrategy:
                default: Restart
                description: UpdateStrategy controls how launch-setting changes are
                  applied.
                enum:
                - Restart
                - Manual
                type: string
              vsock:
                description: Vsock enables the guest virtio-vsock device.
                properties:
                  cid:
                    description: CID is the guest context ID; kube-vm uses 3 when
                      unset.
                    format: int64
                    minimum: 3
                    type: integer
                  port:
                    description: Port is the guest init proxy port (ginit.vsock_port).
                    format: int64
                    maximum: 4294967295
                    minimum: 1
                    type: integer
                required:
                - port
                type: object
            type: object
            x-kubernetes-validations:
            - message: nodeName is immutable
              rule: '(has(self.nodeName) ? self.nodeName : ”) == (has(oldSelf.nodeName)
                ? oldSelf.nodeName : ”)'
            - message: at most one disk may use baseDisk
              rule: '!has(self.disks) || self.disks.filter(d, has(d.baseDisk)).size()
                <= 1'
            - message: memoryBalancing.minMiB must not exceed memoryMiB
              rule: '!has(self.memoryBalancing) || !has(self.memoryBalancing.minMiB)
                || self.memoryBalancing.minMiB <= self.memoryMiB'
            - message: provisioning requires a copy-on-write disk (baseDisk or overlay)
              rule: '!has(self.provisioning) || (has(self.disks) && self.disks.exists(d,
                has(d.baseDisk) || has(d.overlay)))'
            - message: autoCOW requires a baseDisk or path disk
              rule: '!(has(self.autoCOW) && self.autoCOW) || (has(self.disks) && self.disks.exists(d,
                has(d.baseDisk) || has(d.path)))'
            - message: boot.kernel or boot.firmware is required
              rule: has(self.boot) && (has(self.boot.kernel) || has(self.boot.firmware))
          status:
            description: VirtualMachineStatus is the observed state of a VirtualMachine.
            properties:
              conditions:
                description: Conditions are standard Kubernetes conditions.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              interfaces:
                description: Interfaces lists attached NICs.
                items:
                  description: InterfaceStatus reports an attached NIC.
                  properties:
                    gateway:
                      description: Gateway is the NAT gateway address.
                      type: string
                    ipAddress:
                      description: IPAddress is the NAT guest address.
                      type: string
                    mac:
                      description: MAC is the guest MAC address, when known.
                      type: string
                    name:
                      description: Name is the host TAP device.
                      type: string
                    type:
                      description: Type is NAT or TAP.
                      enum:
                      - NAT
                      - TAP
                      type: string
                  type: object
                type: array
              ipAddress:
                description: IPAddress is the first NAT guest address.
                type: string
              lastError:
                description: LastError is the most recent start or daemon error.
                type: string
              launchHash:
                description: LaunchHash identifies the launch settings the VM was
                  started with.
                type: string
              nodeName:
                description: NodeName is the node hosting the VM.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation last reconciled
                  by the agent.
                format: int64
                type: integer
              pauseRequested:
                description: PauseRequested records that spec.paused (not idle detection)
                  paused the VM.
                type: boolean
              phase:
                description: Phase summarises the lifecycle.
                type: string
              sshSecret:
                description: SSHSecret names the Secret holding the generated SSH
                  key pair.
                type: string
              startedAt:
                description: StartedAt is when the VM was last started by the controller.
                format: date-time
                type: string
              vmID:
                description: VMID is the identifier of the VM inside the node's kube-vm
                  daemon.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
